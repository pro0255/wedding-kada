name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # formát (oxfmt) + lint (oxlint) + testy — když neprojde, nenasadí se
      - name: Check
        run: npm run ci

      # Hobby plan blocks deploys whose commit author isn't the Vercel
      # account owner — strip git metadata so the check never applies.
      - name: Remove git metadata
        run: rm -rf .git

      - name: Deploy to Vercel (production)
        run: npx -y vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
